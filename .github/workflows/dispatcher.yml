name: Dispatcher

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger all vote workflows
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          for w in vote_auto.yml vote_auto2.yml vote_auto3.yml; do
            gh workflow run "$w" --repo "$REPO" &
          done
          for i in $(seq 1 10); do
            wf="vote.yml"
            [ "$i" -gt 1 ] && wf="vote${i}.yml"
            gh workflow run "$wf" --repo "$REPO" &
          done
          wait
          echo "Dispatched all at $(date -u)"
